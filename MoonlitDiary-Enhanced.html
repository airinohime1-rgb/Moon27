<style>
/* Layout: a single leather-bound book centred on a dark desk; one leaf visible, page turns swing around the spine. Tools sit in a rail under the book. */
:root {
  --desk: #120a1a;
  --desk2: #1d1029;
  --leather: #2a1230;
  --rose: #ff7ab6;
  --blood: #b3123f;
  --lilac: #cdb4ff;
  --bone: #f6e9ef;
  --muted: #a995b8;
  --ui: 'Quicksand', system-ui, sans-serif;
  --gothic: 'Pirata One', 'UnifrakturCook', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--bone); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  background-image:
    radial-gradient(900px 500px at 50% -10%, rgba(255,122,182,.12), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(205,180,255,.10), transparent 60%);
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

/* header */
header { display: flex; align-items: center; gap: 10px; flex: none; min-width: 0; }
.brand { font-family: var(--gothic); font-size: 26px; letter-spacing: .5px; color: #ffd6e7; text-shadow: 0 0 14px rgba(255,122,182,.45); white-space: nowrap; }
.brand i { font-style: normal; color: var(--rose); }
.spacer { flex: 1; }
.chip {
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center;
}
.chip:hover { background: rgba(255,122,182,.18); }
.chip[aria-pressed="true"] { background: rgba(255,122,182,.28); border-color: var(--rose); }
#status { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* stage + book */
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#book { position: relative; perspective: 1800px; flex: none; }
#book .binding {
  position: absolute; inset: -10px -8px -12px -16px; border-radius: 10px 18px 18px 10px;
  background: linear-gradient(90deg, #12061a 0 14px, var(--leather) 14px, #3a1a42 100%);
  box-shadow: 0 24px 50px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,122,182,.28), inset 0 0 0 5px rgba(0,0,0,.35);
}
#book .binding::after { /* page edges */
  content: ""; position: absolute; top: 8px; bottom: 8px; right: 3px; width: 8px; border-radius: 0 4px 4px 0;
  background: repeating-linear-gradient(180deg, #e9dcd2 0 2px, #bfb0a6 2px 3px);
  opacity: .0;
}
.leaf {
  position: absolute; inset: 0; border-radius: 3px 12px 12px 3px; overflow: hidden;
  transform-origin: left center; backface-visibility: hidden;
  box-shadow: inset 14px 0 18px -10px rgba(0,0,0,.45), inset -2px 0 0 rgba(0,0,0,.12);
}
.leaf.flipper { z-index: 5; will-change: transform; }
.leaf.flipper.fwd { animation: turnFwd .62s cubic-bezier(.5,.1,.3,1) forwards; }
.leaf.flipper.back { animation: turnBack .62s cubic-bezier(.5,.1,.3,1) forwards; }
@keyframes turnFwd { from { transform: rotateY(0); } to { transform: rotateY(-112deg); opacity: .0; } }
@keyframes turnBack { from { transform: rotateY(-112deg); opacity: .0; } to { transform: rotateY(0); opacity: 1; } }
.leaf.flipper::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), transparent 40%); pointer-events: none; }

/* page paper */
.page {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 26px 24px 22px 30px; background-color: var(--p-bg); color: var(--p-ink);
  background-image: var(--p-tex, none);
  --fs: 22px; --lh: calc(var(--fs) * 1.55);
}
.page::before { /* frame */
  content: ""; position: absolute; inset: 9px 9px 9px 15px; border: var(--p-frame, 1.5px dashed) var(--p-accent);
  border-radius: 8px; opacity: .6; pointer-events: none;
}
.deco { position: absolute; width: 96px; height: 96px; background-repeat: no-repeat; background-size: contain; pointer-events: none; opacity: .95; }
.deco.tr { top: 6px; right: 6px; background-position: top right; background-image: var(--d-tr); }
.deco.bl { bottom: 6px; left: 14px; background-position: bottom left; background-image: var(--d-bl); width: 84px; height: 84px; }
.meta { display: flex; align-items: baseline; gap: 10px; position: relative; z-index: 1; padding-right: 70px; min-width: 0; }
.meta .date { font-size: 13px; opacity: .8; font-family: var(--ui); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.meta .mood { border: 0; background: transparent; font-size: 18px; padding: 0 2px; line-height: 1; }
.ptitle {
  position: relative; z-index: 1; width: 100%; border: 0; background: transparent; color: inherit; padding: 2px 0 4px;
  font-family: var(--p-title-font); font-size: 31px; line-height: 1.15; border-bottom: 1.5px solid var(--p-line2);
}
.ptitle::placeholder { color: inherit; opacity: .38; }
.pbody {
  position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; outline: none; padding: 0 2px; margin-top: 2px;
  font-family: var(--f); font-size: var(--fs); line-height: var(--lh); word-wrap: break-word; overflow-wrap: anywhere;
  background-color: var(--p-panel, transparent);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1.5px), var(--p-line) calc(var(--lh) - 1.5px), var(--p-line) var(--lh));
  background-attachment: local; border-radius: 4px;
}
.pbody:empty::before { content: attr(data-ph); opacity: .4; pointer-events: none; }
.pbody::-webkit-scrollbar { width: 6px; } .pbody::-webkit-scrollbar-thumb { background: var(--p-line2); border-radius: 4px; }
.pnum { position: absolute; bottom: 14px; right: 28px; font-size: 12px; opacity: .6; z-index: 1; font-weight: 600; }
.curl { position: absolute; bottom: 0; width: 46px; height: 46px; z-index: 3; border: 0; background: transparent; padding: 0; }
.curl.r { right: 0; background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.18) 50%, rgba(255,255,255,.55) 60%, rgba(255,255,255,.2) 100%); border-radius: 100% 0 12px 0; }
.curl.l { left: 6px; background: linear-gradient(225deg, transparent 50%, rgba(0,0,0,.18) 50%, rgba(255,255,255,.4) 60%, rgba(255,255,255,.1) 100%); border-radius: 0 100% 0 0; }
.curl:hover { filter: brightness(1.15); }

/* cover */
.cover {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
  padding: 36px 30px; color: #ffe3ef;
  background: radial-gradient(circle at 50% 30%, #4a1d52 0, #2a1230 55%, #170a1d 100%);
}
.cover::before { content: ""; position: absolute; inset: 14px 14px 14px 22px; border: 3px double rgba(255,122,182,.7); border-radius: 12px; pointer-events: none; }
.cover .moon { width: 92px; height: 92px; filter: drop-shadow(0 0 14px rgba(255,214,231,.6)); }
.cover input { background: transparent; border: 0; text-align: center; color: inherit; width: 100%; }
.cover .ctitle { font-family: var(--gothic); font-size: 52px; line-height: 1; text-shadow: 0 0 18px rgba(255,122,182,.55); }
.cover .csub { font-family: 'Handlee', cursive; font-size: 20px; color: var(--lilac); }
.cover .cown { font-family: 'Ingrid Darling', 'Handlee', cursive; font-size: 24px; border-bottom: 1.5px dashed rgba(255,122,182,.6) !important; width: 70% !important; }
.cover .hint { font-size: 12px; opacity: .6; margin-top: 8px; }
.ribbon { position: absolute; top: -4px; right: 36px; width: 26px; height: 120px; background: var(--rose); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); box-shadow: 0 4px 10px rgba(0,0,0,.4); z-index: 2; }

/* nav + tools */
.nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
.nbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); font-size: 20px; }
.nbtn:hover:not(:disabled) { background: rgba(255,122,182,.25); }
.nbtn:disabled { opacity: .3; cursor: default; }
#count { font-weight: 700; min-width: 70px; text-align: center; font-size: 15px; }
#tools { flex: none; display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
#tools > * { flex: none; }
.tb { min-width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-size: 15px; padding: 0 9px; }
.tb:hover { background: rgba(255,122,182,.2); }
.sep { width: 1px; height: 24px; background: rgba(255,255,255,.14); margin: 0 4px; }
select.tb { appearance: none; padding: 0 10px; background-color: #26142f; color: var(--bone); max-width: 150px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); padding: 0; }
.pop {
  position: absolute; z-index: 20; background: #241230; border: 1px solid rgba(255,122,182,.4); border-radius: 14px; padding: 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,.6); display: flex; flex-wrap: wrap; gap: 8px; max-width: min(360px, calc(100vw - 32px));
}
.pop .st { width: 40px; height: 40px; font-size: 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); padding: 0; }
.pop .st:hover { background: rgba(255,122,182,.25); }

/* overlays */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(8,3,12,.78); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.sheet .card {
  width: min(760px, 100%); max-height: 86%; overflow: auto; background: #1d1029; border: 1px solid rgba(255,122,182,.35); border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
}
.sheet h2 { font-family: var(--gothic); font-weight: 400; font-size: 28px; margin: 0 0 4px; color: #ffd6e7; }
.sheet .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
.paper-opt, .pg-opt { border: 2px solid transparent; background: transparent; padding: 0; text-align: center; border-radius: 12px; font-size: 12px; font-weight: 600; }
.paper-opt .sw, .pg-opt .sw { display: block; height: 118px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); position: relative; overflow: hidden; }
.paper-opt[aria-pressed="true"], .pg-opt[aria-current="true"] { border-color: var(--rose); }
.paper-opt .tag { position: absolute; top: 6px; left: 6px; font-size: 10px; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.45); color: #fff; }
.paper-opt span.nm, .pg-opt span.nm { display: block; padding: 6px 2px 4px; }
.pg-opt .sw { padding: 8px; font-size: 11px; text-align: left; line-height: 1.3; }
.pg-opt .sw b { display: block; font-size: 13px; margin-bottom: 4px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.btn.pri { background: var(--rose); color: #2a0a18; border-color: var(--rose); }
.btn.danger { border-color: #ff5d7d; color: #ffb3c1; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2d1638; border: 1px solid var(--rose); border-radius: 999px; padding: 9px 16px; font-size: 13px; z-index: 40; }

@media (max-width: 560px) {
  .brand { font-size: 22px; }
  .page { padding: 22px 18px 18px 24px; }
  .ptitle { font-size: 26px; }
  .deco { width: 70px; height: 70px; } .deco.bl { width: 60px; height: 60px; }
  .cover .ctitle { font-size: 42px; }
  .chip .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { .leaf.flipper.fwd, .leaf.flipper.back { animation-duration: .01s; } }
#layer { display: contents; }
.chip { flex: none; }
.brand { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cover { background: radial-gradient(circle at 50% 30%, var(--c1,#4a1d52) 0, var(--c2,#2a1230) 55%, var(--c3,#170a1d) 100%); }
#book.swap { animation: swap .45s ease; }
@keyframes swap { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #book.swap { animation: none; } }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
.bk { border: 2px solid transparent; background: transparent; padding: 0; text-align: center; border-radius: 12px; font-size: 12px; font-weight: 600; }
.bk .cv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 160px; border-radius: 4px 12px 12px 4px; padding: 12px 8px; color: #ffe3ef; overflow: hidden; border: 1px solid rgba(255,122,182,.4); box-shadow: inset 8px 0 10px -6px rgba(0,0,0,.5), 0 6px 14px rgba(0,0,0,.4); }
.bk .cv b { font-family: var(--gothic); font-weight: 400; font-size: 20px; line-height: 1.05; overflow-wrap: anywhere; }
.bk .cv small { font-size: 11px; opacity: .75; }
.bk .nm { display: block; padding: 6px 2px 2px; color: var(--muted); }
.bk[aria-current="true"] { border-color: var(--rose); }
.bk.new .cv { background: transparent; border: 2px dashed rgba(255,122,182,.55); box-shadow: none; color: var(--rose); font-size: 32px; }
.dots { display: flex; gap: 10px; flex-wrap: wrap; }
.dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); padding: 0; }
.dot[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px var(--rose); }
.fld { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: inherit; font: inherit; font-size: 16px; margin-bottom: 14px; }

/* Display modes: the selected paper remains independent of the app's light/dark interface. */
body { --chrome-bg: #120a1a; --chrome-panel: #1d1029; --chrome-text: #f6e9ef; --chrome-muted: #a995b8; --chrome-border: rgba(255,255,255,.16); }
body[data-theme="light"] {
  color-scheme: light;
  --chrome-bg: #f6f0f5; --chrome-panel: #fffafd; --chrome-text: #302437; --chrome-muted: #77657d; --chrome-border: rgba(62,36,70,.2);
  background: #f6f0f5;
  color: #302437;
  background-image: radial-gradient(900px 500px at 50% -10%, rgba(190,128,166,.15), transparent 60%), radial-gradient(700px 500px at 100% 100%, rgba(156,137,205,.13), transparent 60%);
}
body[data-theme="light"] .brand { color: #57304e; text-shadow: 0 0 12px rgba(150,83,135,.16); }
body[data-theme="light"] .brand i { color: #92527e; }
body[data-theme="light"] .chip, body[data-theme="light"] .nbtn, body[data-theme="light"] .tb { color: #47344d; background: rgba(82,48,86,.055); border-color: var(--chrome-border); }
body[data-theme="light"] .chip:hover, body[data-theme="light"] .nbtn:hover:not(:disabled), body[data-theme="light"] .tb:hover { background: rgba(165,105,151,.15); }
body[data-theme="light"] #status, body[data-theme="light"] .bk .nm, body[data-theme="light"] #tools .muted { color: var(--chrome-muted) !important; }
body[data-theme="light"] select.tb { background-color: #fffafd; color: #47344d; }

body[data-theme="light"] .pop .st { color: #47344d; border-color: rgba(82,48,86,.12); background: rgba(82,48,86,.05); }
body[data-theme="light"] .sheet { background: rgba(34,20,37,.36); }
body[data-theme="light"] .sheet .card { background: #fffafd; color: #302437; border-color: rgba(145,93,135,.35); }
body[data-theme="light"] .sheet h2 { color: #57304e; }
body[data-theme="light"] .sheet .sub { color: #77657d; }

body[data-theme="light"] .btn { color: #47344d; background: rgba(82,48,86,.055); border-color: rgba(62,36,70,.2); }
body[data-theme="light"] .btn.pri { color: #fff; background: #92527e; border-color: #92527e; }
body[data-theme="light"] .fld { color: #302437; background: #fff; border-color: rgba(62,36,70,.24); }
body[data-theme="light"] .toast { color: #302437; background: #fffafd; border-color: #92527e; box-shadow: 0 8px 25px rgba(48,27,53,.14); }
body[data-theme="light"] .sep { background: rgba(62,36,70,.18); }
#installBtn[hidden] { display: none !important; }
#installBtn { white-space: nowrap; }
@media (max-width: 560px) {
  header { gap: 6px; }
  .chip { padding: 7px 9px; }
  #status { display: none; }
}

/* Extra typography, gallery layouts and comfort tools inspired by the reference diary videos. */
.pbody { font-weight: var(--fw, 400); }
.font-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(142px,1fr)); gap:9px; margin:12px 0; }
.font-opt { text-align:left; padding:10px; border:1px solid var(--chrome-border,rgba(255,255,255,.16)); border-radius:12px; background:rgba(255,255,255,.035); min-width:0; }
.font-opt[aria-pressed="true"] { border:2px solid var(--rose); background:rgba(255,122,182,.1); padding:9px; }
.font-opt .font-name {display:block;font:600 12px var(--ui);color:var(--chrome-muted,#a995b8);margin-bottom:7px;}
.font-opt .font-sample {display:block;font-size:20px;line-height:1.15;overflow-wrap:anywhere;}
.font-category {display:flex;gap:7px;overflow-x:auto;padding:4px 0 9px;scrollbar-width:thin;}
.color-swatch-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:12px 0;}
.color-opt {width:100%;aspect-ratio:1;border:2px solid rgba(120,120,120,.3);border-radius:50%;padding:0;min-width:0;}
.color-opt:focus,.color-opt:hover {outline:2px solid var(--rose);outline-offset:2px;}
.font-category .btn,.theme-category .btn {white-space:nowrap;padding:7px 11px;font-size:12px;}
.theme-category {display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin;}
.range-line {display:flex;align-items:center;gap:12px;margin:12px 0 18px;}
.range-line input {flex:1;min-width:0;accent-color:var(--rose);}
.range-value {font-variant-numeric:tabular-nums;font-weight:700;min-width:54px;text-align:right;}
#stage.overview {display:block;overflow:auto;align-items:stretch;justify-content:flex-start;padding:8px 3px 12px;}

#overview {width:100%;max-width:720px;margin:0 auto;padding:4px 5px 14px;}
#overview[hidden] {display:none!important;}
.overview-head {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 3px 13px;}
.overview-head h2 {font:26px var(--gothic);color:var(--chrome-text);margin:0;overflow-wrap:anywhere;}
.overview-head small {color:var(--chrome-muted);white-space:nowrap;}
.overview-search {width:100%;padding:11px 13px;border:1px solid var(--chrome-border);border-radius:12px;background:var(--chrome-panel);color:var(--chrome-text);font:14px var(--ui);margin:0 0 13px;}
.overview-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:12px;}
.overview-card {text-align:left;min-width:0;border:1px solid var(--chrome-border);border-radius:12px;padding:12px;background:var(--chrome-panel);color:var(--chrome-text);box-shadow:0 6px 18px rgba(0,0,0,.08);}
.overview-card .ov-paper {height:132px;border-radius:7px;padding:12px 10px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.overview-card .ov-paper b {display:block;font-size:15px;line-height:1.2;margin-bottom:7px;overflow-wrap:anywhere;}
.overview-card .ov-paper span {font-size:11px;line-height:1.35;display:block;opacity:.84;}
.overview-card .ov-meta {display:flex;justify-content:space-between;gap:6px;color:var(--chrome-muted);font:11px var(--ui);margin-top:8px;}
.overview-list {display:grid;gap:0;}
.overview-list .overview-card {display:grid;grid-template-columns:42px 1fr;align-items:start;gap:11px;border:0;border-bottom:1px solid var(--chrome-border);border-radius:0;box-shadow:none;background:transparent;padding:14px 5px;}
.overview-list .ov-index {width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chrome-panel);border:1px solid var(--chrome-border);color:var(--chrome-muted);font:12px var(--ui);}
.overview-list .ov-paper {display:none;}
.overview-list .ov-main b {display:block;font-size:17px;margin:0 0 4px;}
.overview-list .ov-main p {font-size:13px;line-height:1.45;color:var(--chrome-muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.overview-list .ov-meta {display:flex;gap:12px;color:var(--chrome-muted);font:11px var(--ui);margin-top:6px;}
.overview-add {display:block;width:100%;padding:13px;border:1px dashed var(--chrome-border);border-radius:12px;color:var(--chrome-muted);margin-top:13px;background:transparent;}
body[data-theme="light"] .font-opt {background:#fff;}
body[data-theme="light"] .overview-card {box-shadow:0 5px 16px rgba(48,27,53,.06);}
#soundPlayer {position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100vw - 20px));z-index:28;background:var(--chrome-panel);color:var(--chrome-text);border:1px solid var(--chrome-border);border-radius:14px;padding:9px 12px;box-shadow:0 8px 28px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;}
#soundPlayer[hidden] {display:none!important;}
#soundPlayer .sp-info {min-width:0;flex:1;font:12px var(--ui);}
#soundPlayer .sp-info b {display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#soundPlayer .sp-actions {display:flex;gap:6px;}
#soundPlayer button {border:1px solid var(--chrome-border);border-radius:9px;padding:7px 9px;font:12px var(--ui);}
.sound-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0;}
.sound-tile {border:1px solid var(--chrome-border);border-radius:12px;padding:12px 7px;background:rgba(255,255,255,.035);text-align:center;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
.sound-tile[aria-pressed="true"] {border-color:var(--rose);background:rgba(255,122,182,.12);color:var(--rose);}
.sound-tile .sound-ico {font-size:22px;line-height:1;}
.sound-tile small {font:11px var(--ui);}
.sound-tabs {display:flex;justify-content:center;gap:8px;margin:8px 0 12px;}
.sound-tabs button {border:1px solid var(--chrome-border);border-radius:999px;padding:8px 16px;font:12px var(--ui);}
.sound-tabs button[aria-pressed="true"] {border-color:var(--rose);color:var(--rose);}
.sound-mixes {display:grid;gap:9px;}
.sound-mix {text-align:left;border:1px solid var(--chrome-border);border-radius:12px;padding:12px;background:rgba(255,255,255,.035);}
.sound-mix b {display:block;font-size:14px;margin-bottom:3px;}
.sound-mix small {color:var(--chrome-muted);}
.sound-timer {display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0;}
.sound-timer select {background:var(--chrome-panel);color:var(--chrome-text);border:1px solid var(--chrome-border);border-radius:9px;padding:8px;}
#lockscreen {position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 20%,#35213d,#100a14 75%);color:#f6e9ef;display:grid;place-items:center;padding:22px;}
#lockscreen[hidden] {display:none!important;}
.lock-card {width:min(360px,100%);text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:26px 22px;background:rgba(20,12,26,.9);box-shadow:0 20px 60px rgba(0,0,0,.35);}
.lock-card h2 {font:30px var(--gothic);margin:0 0 6px;color:#ffd6e7;}
.lock-card p {color:#bdaec6;font:13px var(--ui);margin:0 0 18px;}
.lock-dots {display:flex;justify-content:center;gap:13px;margin:18px 0 20px;}
.lock-dots i {width:12px;height:12px;border:1px solid #cdb4ff;border-radius:50%;}
.lock-dots i.filled {background:#ff7ab6;border-color:#ff7ab6;}
.lock-keys {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:250px;margin:0 auto;}
.lock-keys button {height:52px;border:1px solid rgba(255,255,255,.16);border-radius:50%;font:20px var(--ui);background:rgba(255,255,255,.045);}
.lock-keys button:active {background:rgba(255,122,182,.2);}
.lock-error {min-height:20px;color:#ff9eaf;font:12px var(--ui);margin-top:10px;}
@media(max-width:560px){.brand{font-size:18px;max-width:116px}.chip{padding:6px 7px}header{gap:3px}#installBtn{display:none!important}}
@media(max-width:420px){.sound-grid{grid-template-columns:repeat(3,minmax(0,1fr));}.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

  function createBook(name, hue) {

      var row = mk('div', 'row'); var y = mk('button', 'btn danger', 'Delete diary');

  document.getElementById('shelfBtn').onclick = shelfSheet;
  document.getElementById('saveBtn').onclick = saveNow;

  /* ---------- light / dark display ---------- */
  var themeBtn = document.getElementById('themeBtn');
  function applyDisplayTheme(mode) {
    mode = mode === 'light' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', mode);
    document.documentElement.style.colorScheme = mode;
    try { localStorage.setItem('moonlit-display-theme', mode); } catch (e) {}

  /* ---------- add to home screen / PWA install ---------- */

  function installHelp() {

      var steps = [
        '1. Open the diary website in Google Chrome on your phone.',

        '3. Choose “Install app” or “Add to Home screen”.',
        '4. Tap Install or Add. The diary icon will appear with your other apps.'
      ];

      var note = mk('p', 'sub', 'Your diary entries are stored in this browser on this device. Use the same browser and device to see them.'); card.appendChild(note);
    });
  }
  window.addEventListener('beforeinstallprompt', function (e) {

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function () { setStatus('ready to write'); });
    });
  }

  /* ---------- swipe ---------- */
  var sx = 0, sy = 0, st0 = 0;
  stage.addEventListener('touchstart', function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st0 = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (S.layout !== 'pages') return;
    var sel = window.getSelection && window.getSelection(); if (sel && !sel.isCollapsed) return;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - st0 < 600) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- synthesized sound studio (no external audio files) ---------- */
  var SOUND_LIST=[
    ['guitar','Acoustic guitar','♫','music'],['piano','Piano','▥','music'],['serene','Serene moments','✧','music'],['musicbox','Music box','▣','music'],
    ['light-rain','Light rain','☂','nature'],['window-rain','Rain on window','☔','nature'],['heavy-rain','Heavy rain','⛈','nature'],['thunder','Distant thunder','ϟ','nature'],
    ['ocean','Ocean waves','≋','nature'],['river','River stream','〰','nature'],['fire','Hearth fire','♨','nature'],['wind','Moor wind','⌁','nature'],
    ['droplets','Droplets','◦','nature'],['bubbles','Bubbles','○','nature'],['crickets','Night crickets','♧','nature'],['bells','Cathedral bells','♢','music']
  ];
  var SOUND_MIXES=[
    ['Quiet evening','Rain on window · Music box',['window-rain','musicbox']],
    ['Cathedral hour','Cathedral bells · Moor wind · Light rain',['bells','wind','light-rain']],
    ['Ocean dusk','Ocean waves · Piano · Serene moments',['ocean','piano','serene']],
    ['Hearth & rain','Hearth fire · Acoustic guitar · Rain on window',['fire','guitar','window-rain']],
    ['Forest after rain','River stream · Night crickets · Droplets',['river','crickets','droplets']]
  ];
  var audioState={ctx:null,master:null,tracks:{},timer:null,timerLabel:'No timer',white:null,brown:null,paused:false};
  function audioEnsure(){if(!audioState.ctx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio is not supported by this browser.');audioState.ctx=new AC();audioState.master=audioState.ctx.createGain();audioState.master.gain.value=.7;audioState.master.connect(audioState.ctx.destination)}if(audioState.ctx.state==='suspended')audioState.ctx.resume();return audioState.ctx}
  function noiseBuf(brown){var c=audioEnsure();var key=brown?'brown':'white';if(audioState[key])return audioState[key];var n=c.sampleRate*4,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0),last=0;for(var i=0;i<n;i++){var w=Math.random()*2-1;if(brown){last=(last+.025*w)/1.025;d[i]=last*4}else d[i]=w}audioState[key]=buf;return buf}
  function addNoise(rec,brown,hpHz,lpHz,level){var c=audioEnsure(),src=c.createBufferSource();src.buffer=noiseBuf(!!brown);src.loop=true;var node=src;
    if(hpHz){var hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=hpHz;node.connect(hp);node=hp;rec.nodes.push(hp)}
    if(lpHz){var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=lpHz;node.connect(lp);node=lp;rec.nodes.push(lp)}
    var g=c.createGain();g.gain.value=level;node.connect(g);g.connect(rec.bus);src.start();rec.nodes.push(src,g);return g}
  function tone(rec,freq,wave,vol,dur){var c=audioEnsure(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=wave||'sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(rec.bus);o.start(t);o.stop(t+dur+.04);rec.nodes.push(o,g)}
  function repeatSound(rec,fn,min,max,first){function tick(){if(!rec.live)return;try{fn()}catch(e){}var id=setTimeout(tick,min+Math.random()*(max-min));rec.timers.push(id)}var id=setTimeout(tick,first||min);rec.timers.push(id)}
  function startSound(id){var c=audioEnsure();if(audioState.tracks[id])return;if(audioState.paused){audioState.paused=false;audioState.master.gain.setTargetAtTime(.7,c.currentTime,.08)}var rec={live:true,nodes:[],timers:[],bus:c.createGain()};rec.bus.gain.value=.82;rec.bus.connect(audioState.master);audioState.tracks[id]=rec;
    if(id==='light-rain'){addNoise(rec,false,700,8500,.24)}
    else if(id==='window-rain'){addNoise(rec,true,100,1600,.58);addNoise(rec,false,1300,8500,.10)}
    else if(id==='heavy-rain'){addNoise(rec,false,300,10000,.34);addNoise(rec,true,80,700,.35)}
    else if(id==='ocean'){var g=addNoise(rec,true,35,650,.65),l=c.createOscillator(),lg=c.createGain();l.frequency.value=.075;lg.gain.value=.22;l.connect(lg);lg.connect(g.gain);l.start();rec.nodes.push(l,lg)}
    else if(id==='river'){addNoise(rec,false,350,5000,.16);addNoise(rec,true,100,1200,.14)}
    else if(id==='wind'){var g=addNoise(rec,true,120,900,.42),l=c.createOscillator(),lg=c.createGain();l.frequency.value=.09;lg.gain.value=.2;l.connect(lg);lg.connect(g.gain);l.start();rec.nodes.push(l,lg)}
    else if(id==='fire'){addNoise(rec,true,40,500,.45);repeatSound(rec,function(){tone(rec,900+Math.random()*2300,'triangle',.035+Math.random()*.055,.045+Math.random()*.06)},180,700,300)}
    else if(id==='thunder'){addNoise(rec,true,35,150,.24);repeatSound(rec,function(){tone(rec,42+Math.random()*25,'sine',.32,2.8)},12000,26000,3500)}
    else if(id==='crickets'){repeatSound(rec,function(){var f=3800+Math.random()*900;tone(rec,f,'sine',.035,.09);setTimeout(function(){if(rec.live)tone(rec,f+180,'sine',.028,.08)},130)},1100,2600,500)}
    else if(id==='droplets'){repeatSound(rec,function(){tone(rec,600+Math.random()*1000,'sine',.13,.22)},900,2600,450)}
    else if(id==='bubbles'){repeatSound(rec,function(){tone(rec,180+Math.random()*400,'sine',.10,.32)},500,1500,300)}
    else if(id==='bells'){repeatSound(rec,function(){var f=[440,554,659,740][Math.random()*4|0];tone(rec,f,'sine',.12,2.8);tone(rec,f*2.01,'sine',.035,1.8)},4500,9000,500)}
    else if(id==='piano'){var notes=[220,261.63,293.66,329.63,392,440,523.25];repeatSound(rec,function(){tone(rec,notes[Math.random()*notes.length|0],'triangle',.11,1.5)},800,2100,300)}
    else if(id==='guitar'){var notes=[146.83,196,220,246.94,293.66,329.63];repeatSound(rec,function(){var f=notes[Math.random()*notes.length|0];tone(rec,f,'triangle',.14,1.15);tone(rec,f*2,'sine',.035,.35)},550,1400,200)}
    else if(id==='musicbox'){var notes=[523.25,587.33,659.25,783.99,880,987.77,1046.5];repeatSound(rec,function(){tone(rec,notes[Math.random()*notes.length|0],'sine',.10,1.2)},400,1000,150)}
    else if(id==='serene'){[130.81,164.81,196].forEach(function(f){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(rec.bus);o.start();rec.nodes.push(o,g)});var n=c.createOscillator(),ng=c.createGain();n.frequency.value=.035;ng.gain.value=.35;n.connect(ng);ng.connect(rec.bus.gain);n.start();rec.nodes.push(n,ng)}
  }
  function stopSound(id){var rec=audioState.tracks[id];if(!rec)return;rec.live=false;rec.timers.forEach(clearTimeout);try{rec.bus.gain.setTargetAtTime(0,audioState.ctx.currentTime,.3)}catch(e){}setTimeout(function(){rec.nodes.forEach(function(n){try{if(n.stop)n.stop()}catch(e){}try{n.disconnect()}catch(e){}});try{rec.bus.disconnect()}catch(e){}},1100);delete audioState.tracks[id]}
  function activeSoundNames(){return SOUND_LIST.filter(function(s){return !!audioState.tracks[s[0]]}).map(function(s){return s[1]})}
  function stopAllSounds(){Object.keys(audioState.tracks).forEach(stopSound);if(audioState.timer)clearTimeout(audioState.timer);audioState.timer=null;audioState.timerLabel='No timer';updateSoundPlayer()}
  function updateSoundPlayer(){var el=document.getElementById('soundPlayer');if(!el)return;var names=activeSoundNames(),btn=document.getElementById('soundBtn');el.hidden=!names.length;if(btn)btn.setAttribute('aria-pressed',names.length?'true':'false');if(!names.length){el.innerHTML='';return}el.innerHTML='';var info=mk('div','sp-info');info.appendChild(mk('b',null,names.length>2?names.length+' sounds playing':names.join(' + ')));info.appendChild(mk('span',null,audioState.timerLabel));var actions=mk('div','sp-actions');var pause=mk('button',null,audioState.paused?'Resume':'Pause');pause.onclick=function(){audioState.paused=!audioState.paused;if(audioState.master&&audioState.ctx)audioState.master.gain.setTargetAtTime(audioState.paused?0:.7,audioState.ctx.currentTime,.08);updateSoundPlayer()};var open=mk('button',null,'Mixer');open.onclick=soundSheet;var stop=mk('button',null,'Stop');stop.onclick=stopAllSounds;actions.appendChild(pause);actions.appendChild(open);actions.appendChild(stop);el.appendChild(info);el.appendChild(actions)}
  function soundSheet(){var tab='sounds',cardRef=null;
    sheet('Relaxing sounds','All sounds are generated locally in your browser. Mix several together.',function(card){cardRef=card;
      var tabs=mk('div','sound-tabs'),pane=mk('div');
      function draw(){tabs.innerHTML='';['sounds','mixes'].forEach(function(t){var b=mk('button',null,t==='sounds'?'Sounds':'Mixes');b.setAttribute('aria-pressed',tab===t);b.onclick=function(){tab=t;draw()};tabs.appendChild(b)});pane.innerHTML='';
        if(tab==='sounds'){var grid=mk('div','sound-grid');SOUND_LIST.forEach(function(s){var b=mk('button','sound-tile');b.setAttribute('aria-pressed',!!audioState.tracks[s[0]]);b.appendChild(mk('span','sound-ico',s[2]));b.appendChild(mk('small',null,s[1]));b.onclick=function(){try{if(audioState.tracks[s[0]])stopSound(s[0]);else startSound(s[0]);updateSoundPlayer();draw()}catch(e){toast(e.message||'Audio could not start.')}};grid.appendChild(b)});pane.appendChild(grid)}
        else{var mixes=mk('div','sound-mixes');SOUND_MIXES.forEach(function(m){var b=mk('button','sound-mix');b.appendChild(mk('b',null,m[0]));b.appendChild(mk('small',null,m[1]));b.onclick=function(){stopAllSounds();try{m[2].forEach(startSound);audioState.timerLabel='No timer';updateSoundPlayer();draw()}catch(e){toast('Audio could not start.')}};mixes.appendChild(b)});pane.appendChild(mixes)}
        var timer=mk('div','sound-timer');timer.appendChild(mk('span','sub','Sleep timer'));var sel=mk('select');[['0','Off'],['5','5 min'],['15','15 min'],['30','30 min'],['60','60 min']].forEach(function(o){var op=mk('option',null,o[1]);op.value=o[0];sel.appendChild(op)});sel.onchange=function(){if(audioState.timer)clearTimeout(audioState.timer);audioState.timer=null;var n=+sel.value;audioState.timerLabel=n?n+' minute timer':'No timer';if(n)audioState.timer=setTimeout(stopAllSounds,n*60000);updateSoundPlayer()};timer.appendChild(sel);var stop=mk('button','btn','Stop all');stop.onclick=function(){stopAllSounds();draw()};timer.appendChild(stop);pane.appendChild(timer);
        var note=mk('p','sub','Sound continues while this panel is closed. Use Stop to end every layer.');pane.appendChild(note);
      }
      card.appendChild(tabs);card.appendChild(pane);draw();
    });
  }
  document.getElementById('soundBtn').onclick=soundSheet;

  /* ---------- optional local PIN lock (a convenience lock, not encryption) ---------- */
  var PIN_KEY='moonlit-diary-pin-sha256';
  function getPinHash(){try{return localStorage.getItem(PIN_KEY)}catch(e){return null}}
  function setPinHash(hash){try{localStorage.setItem(PIN_KEY,hash);return true}catch(e){return false}}
  function removePinHash(){try{localStorage.removeItem(PIN_KEY);return true}catch(e){return false}}
  async function digestPin(pin){if(!window.crypto||!crypto.subtle)throw new Error('PIN setup needs a secure browser context (HTTPS).');var bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin));return Array.from(new Uint8Array(bytes)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
  function pinMenu(){var exists=!!getPinHash();sheet('Privacy lock','This PIN is a casual privacy screen for this browser, not encryption of your diary data.',function(card){
      var set=mk('button','btn pri',exists?'Change PIN':'Set a 4-digit PIN');set.onclick=pinSettingsSheet;card.appendChild(set);
      if(exists){var lock=mk('button','btn','Lock now');lock.onclick=function(){closeSheet();showLockScreen()};card.appendChild(lock);var remove=mk('button','btn danger','Remove PIN');remove.onclick=pinRemoveSheet;card.appendChild(remove)}
    })}
  function pinSettingsSheet(){var exists=!!getPinHash();sheet(exists?'Change PIN':'Create a PIN','Choose four digits. You will need this PIN to reopen the diary on this device.',function(card){
      var old=exists?mk('input','fld',null,{type:'password',inputmode:'numeric',maxlength:4,placeholder:'Current PIN','aria-label':'Current PIN'}):null;
      var a=mk('input','fld',null,{type:'password',inputmode:'numeric',maxlength:4,placeholder:'New 4-digit PIN','aria-label':'New PIN'});var b=mk('input','fld',null,{type:'password',inputmode:'numeric',maxlength:4,placeholder:'Confirm new PIN','aria-label':'Confirm new PIN'});
      if(old)card.appendChild(old);card.appendChild(a);card.appendChild(b);var ok=mk('button','btn pri','Save PIN');ok.onclick=async function(){try{if(exists&&await digestPin(old.value)!==getPinHash()){toast('Current PIN is not correct.');return}if(!/^\d{4}$/.test(a.value)||a.value!==b.value){toast('Enter matching four-digit PINs.');return}if(!setPinHash(await digestPin(a.value))){toast('This browser does not allow PIN storage.');return}closeSheet();toast('PIN saved on this device.')}catch(e){toast(e.message||'Could not save PIN.')}};card.appendChild(ok);
    })}
  function pinRemoveSheet(){sheet('Remove the PIN','Enter your current PIN to turn off the privacy screen.',function(card){var inp=mk('input','fld',null,{type:'password',inputmode:'numeric',maxlength:4,placeholder:'Current PIN'});var b=mk('button','btn danger','Remove PIN');b.onclick=async function(){try{if(await digestPin(inp.value)!==getPinHash()){toast('PIN is not correct.');return}if(!removePinHash()){toast('This browser does not allow PIN storage.');return}closeSheet();toast('PIN removed.')}catch(e){toast('Could not verify PIN.')}};card.appendChild(inp);card.appendChild(b)})}
  function showLockScreen(){var el=document.getElementById('lockscreen'),digits='';el.hidden=false;el.innerHTML='';var card=mk('div','lock-card');card.appendChild(mk('h2',null,'Moonlit Diary'));card.appendChild(mk('p',null,'Enter your four-digit PIN to unlock this diary.'));var dots=mk('div','lock-dots');var error=mk('div','lock-error');var keys=mk('div','lock-keys');var unlock=mk('button','btn pri','Unlock');
    function drawDots(){dots.innerHTML='';for(var i=0;i<4;i++){var d=mk('i');if(i<digits.length)d.className='filled';dots.appendChild(d)}}
    async function attempt(){if(digits.length!==4){error.textContent='Enter all four digits.';return}try{if(await digestPin(digits)===getPinHash()){el.hidden=true;el.innerHTML='';digits='';return}error.textContent='That PIN did not match. Try again.';digits='';drawDots()}catch(e){error.textContent='PIN could not be checked in this browser.'}}
    for(var n=1;n<=9;n++){(function(v){var b=mk('button',null,String(v));b.onclick=function(){if(digits.length<4){digits+=v;drawDots();error.textContent='';if(digits.length===4)attempt()}};keys.appendChild(b)})(n)}
    var blank=mk('span');var zero=mk('button',null,'0');zero.onclick=function(){if(digits.length<4){digits+='0';drawDots();if(digits.length===4)attempt()}};var del=mk('button',null,'⌫');del.onclick=function(){digits=digits.slice(0,-1);drawDots();error.textContent=''};keys.appendChild(blank);keys.appendChild(zero);keys.appendChild(del);unlock.onclick=attempt;card.appendChild(dots);card.appendChild(keys);card.appendChild(error);card.appendChild(unlock);el.appendChild(card);drawDots()}
  document.getElementById('lockBtn').onclick=pinMenu;

  /* ---------- boot ---------- */
  sizeBook(); show(cur); refreshBrand(); setStatus('saved here'); if (S.layout && S.layout !== 'pages') setLayoutMode(S.layout, false); updateSoundPlayer(); var hasPIN=!!getPinHash(); if (hasPIN) showLockScreen();
  window.addEventListener('pagehide', function () { flush(); saveLocal(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { flush(); persist(); } });

  // Cloud copy: private to the signed-in viewer. Newer copy wins.
  (async function () {
    try {
      var db = await window.claude.use('db'), user = await window.claude.use('user');
      if (!db || !user) return;
      var id = await user.id(); if (!id) return;
      var ref = db.collection('data/users/' + id).doc('diary');
      var snap = await ref.get();
      if (snap.exists) {
        var rec = snap.data(); var remote = fixShelf(rec && rec.book ? JSON.parse(rec.book) : null);
        if (remote && (remote.updated || 0) > (shelf.updated || 0) && !busy) {
          shelf = remote; activate(shelf.active); saveLocal(); show(cur); refreshBrand();
        }
        lastSavedStr = rec && rec.book || '';
      }
      dbDoc = ref; dbReady = true;
      if (JSON.stringify(shelf) !== lastSavedStr) persist(); else setStatus('saved ♡');
    } catch (e) { }
  })();
})();
